# 将以下段落合并到现有 Mihomo 配置，并填写 Subscription 的订阅地址。
proxy-providers:
  Subscription:
    type: http
    path: ./proxy-providers/Subscription.yaml
    url: "https://subscription.example.invalid/mihomo"
    interval: 86400
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      lazy: true

  # 本地代理节点示例（不含敏感信息，用于文档参考）：
