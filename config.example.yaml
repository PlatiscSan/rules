dns:
  enable: true
  respect-rules: true
  default-nameserver: [https://223.5.5.5/dns-query]
  proxy-server-nameserver: [https://223.5.5.5/dns-query]
  nameserver:
    - 'https://1.1.1.1/dns-query#Proxy'
    - 'https://1.0.0.1/dns-query#Proxy'
