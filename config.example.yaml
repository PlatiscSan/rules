rules:
  - RULE-SET,LocalNetwork,DIRECT
  - IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
  # Requires Mihomo's standard geosite data; block ads before Google rules.
  - GEOSITE,category-ads-all,REJECT
  # Direct CDN rules must precede their broader API rules.
  - RULE-SET,GameCDN,GameCDN
  - RULE-SET,MicrosoftCDN,MicrosoftCDN
  - RULE-SET,YouTubeCDN,YouTubeCDN
  - RULE-SET,GoogleCDN,GoogleCDN
  - RULE-SET,GitHubCDN,GitHubCDN
  - RULE-SET,DeveloperCDN,DeveloperCDN
