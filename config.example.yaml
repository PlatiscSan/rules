# 将以下段落合并到现有 Mihomo 配置，并填写 Subscription 的订阅地址。
proxy-providers:
  Subscription:
    type: http
    path: ./proxy-providers/Subscription.yaml
    url: "https://subscription.example.invalid/mihomo"
    interval: 86400
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      lazy: true

  # 本地代理节点示例（不含敏感信息，用于文档参考）：
  # LocalExample:
  #   type: file
  #   path: ./proxies/local.yaml

rule-providers:
  LocalNetwork:
    type: file
    behavior: classical
    format: text
    path: ./rules/LocalNetwork.list
  AI:
    type: file
    behavior: classical
    format: text
    path: ./rules/AI.list
  Google:
    type: file
    behavior: classical
    format: text
    path: ./rules/Google.list
  GitHub:
    type: file
    behavior: classical
    format: text
    path: ./rules/GitHub.list
  GameAPI:
    type: file
    behavior: classical
    format: text
    path: ./rules/GameAPI.list
  GameCDN:
    type: file
    behavior: classical
    format: text
    path: ./rules/GameCDN.list
  MicrosoftAPI:
    type: file
    behavior: classical
    format: text
    path: ./rules/MicrosoftAPI.list
  MicrosoftCDN:
    type: file
    behavior: classical
    format: text
    path: ./rules/MicrosoftCDN.list
  Bahamut:
    type: file
    behavior: classical
    format: text
    path: ./rules/Bahamut.list
  Developer:
    type: file
    behavior: classical
    format: text
    path: ./rules/Developer.list
  Telegram:
    type: file
    behavior: classical
    format: text
    path: ./rules/Telegram.list
  Discord:
    type: file
    behavior: classical
    format: text
    path: ./rules/Discord.list
  SocialMedia:
    type: file
    behavior: classical
    format: text
    path: ./rules/SocialMedia.list
  Streaming:
    type: file
    behavior: classical
    format: text
    path: ./rules/Streaming.list

proxy-groups:
  - name: Proxy
    type: select
    use: [Subscription]
  - name: AI
    type: select
    proxies: [Proxy, DIRECT]
    use: [Subscription]
  - name: Taiwan
    type: select
    use: [Subscription]
    empty-fallback: REJECT
    filter: '(?i)🇹🇼|台湾|台灣|臺灣|台北|臺北|taiwan|taipei|\btw\b'
  - name: Google
    type: select
    proxies: [Proxy]
    use: [Subscription]
  - name: GitHub
    type: select
    proxies: [Proxy]
    use: [Subscription]
  - name: GameAPI
    type: select
    proxies: [Proxy]
    use: [Subscription]
  - name: MicrosoftAPI
    type: select
    proxies: [Proxy]
    use: [Subscription]
  - name: Developer
    type: select
    proxies: [Proxy]
    use: [Subscription]
  - name: Telegram
    type: select
    proxies: [Proxy]
    use: [Subscription]
  - name: Discord
    type: select
    proxies: [Proxy]
    use: [Subscription]
  - name: SocialMedia
    type: select
    proxies: [Proxy]
    use: [Subscription]
  - name: Streaming
    type: select
    proxies: [Proxy]
    use: [Subscription]

rules:
  - RULE-SET,LocalNetwork,DIRECT
  # Requires Mihomo's standard geosite data; block ads before Google rules.
  - GEOSITE,category-ads-all,REJECT
  # Direct CDN rules must precede their broader API rules.
  - RULE-SET,GameCDN,DIRECT
  - RULE-SET,MicrosoftCDN,DIRECT
  # Keep AI ahead of Google so Gemini and Vertex AI use the AI group.
  - RULE-SET,AI,AI
  - RULE-SET,Bahamut,Taiwan
  - RULE-SET,Google,Google
  - RULE-SET,GitHub,GitHub
  - RULE-SET,GameAPI,GameAPI
  - RULE-SET,MicrosoftAPI,MicrosoftAPI
  - RULE-SET,Developer,Developer
  - RULE-SET,Telegram,Telegram
  - RULE-SET,Discord,Discord
  - RULE-SET,SocialMedia,SocialMedia
  - RULE-SET,Streaming,Streaming
  # Custom routing above takes precedence over mainland China direct rules.
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
