  - RULE-SET,TwitchCDN,TwitchCDN
  - RULE-SET,VimeoCDN,VimeoCDN
  - RULE-SET,BahamutCDN,BahamutCDN
  # Keep AI ahead of Google so Gemini and Vertex AI use the AI group.
  - RULE-SET,OpenAI,OpenAI
  - RULE-SET,Claude,Claude
  - RULE-SET,Kimi,Kimi
  - RULE-SET,Gemini,Gemini
  - RULE-SET,DeepSeek,DeepSeek
