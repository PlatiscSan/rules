proxy-groups:
  - name: Proxy
    type: select
    empty-fallback: REJECT
    use: [Subscription]
  - name: AI
    type: select
    proxies: [Proxy, DIRECT]
    use: [Subscription]
  - name: Bahamut
    type: select
    use: [Subscription]
    empty-fallback: REJECT
    filter: '(?i)🇹🇼|台湾|台灣|臺灣|台北|臺北|taiwan|taipei|\btw\b'
