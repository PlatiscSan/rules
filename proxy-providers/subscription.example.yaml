# 代理节点提供者模板。将示例 URL 替换为你自己的订阅地址，并不要提交包含私有凭据的文件。
#
# 使用方式：在完整配置的 proxy-providers 下合并此文件，或以 type: http 远程引用订阅。

providers:
  Subscription:
    type: http
    url: "https://example.com/subscription?token=YOUR_TOKEN"  # 替换为你的实际订阅 URL
    interval: 86400
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      lazy: true

  # 本地代理节点示例（不含敏感信息，用于文档参考）：
  # LocalExample:
  #   type: file
  #   path: ./proxies/local.yaml
