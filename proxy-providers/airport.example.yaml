# 机场订阅代理提供者模板。将示例 URL 替换为你的机场订阅地址，不要提交私有订阅或凭据。
#
# 大多数机场订阅返回 Clash/Mihomo 格式的 YAML，可直接作为 proxy-providers 使用。
# 优先使用机场提供的 Clash/Mihomo YAML 订阅地址。使用 Airport 作为键时，同步修改策略组的 use。

proxy-providers:
  Airport:
    type: http
    url: "https://subscription.example.invalid/mihomo"
    interval: 86400
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      lazy: true

  # 多机场备份示例（根据需要启用）：
  # AirportBackup:
  #   type: http
  #   url: "https://backup-subscription.example.invalid/mihomo"
  #   interval: 86400
